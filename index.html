<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stella — 지금 상영 중</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <h1 class="logo">STELLA</h1>
        <p class="tagline">지금 상영 중인 영화</p>
      </div>
    </header>

    <main class="main">
      <section class="hero">
        <h2 class="hero__title">최신 라인업</h2>
        <p class="hero__desc">The Movie Database에서 가져온 현재 상영작입니다.</p>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <ul id="movie-grid" class="movie-grid" aria-label="영화 목록"></ul>
    </main>

    <footer class="footer">
      <p>데이터 제공: <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a></p>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
