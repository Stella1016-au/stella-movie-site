<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stella — Now Playing</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="intro" aria-label="Intro">
      <div class="intro__stage">
        <img class="intro__ball" src="ball(back_no).png" alt="Purple orb image" />
        <a class="intro__scroll" href="#content-start" aria-label="Scroll down">Scroll Down</a>
      </div>
    </section>

    <header class="header">
      <div class="header__inner">
        <h1 class="logo">STELLA</h1>
        <p class="tagline">Now Playing Movies</p>
      </div>
    </header>

    <main id="content-start" class="main">
      <section class="hero">
        <h2 class="hero__title">Latest Lineup</h2>
        <p class="hero__desc">Current theatrical releases fetched from The Movie Database.</p>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <ul id="movie-grid" class="movie-grid" aria-label="Movie list"></ul>
    </main>

    <footer class="footer">
      <p>Data provided by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a></p>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
